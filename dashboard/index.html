<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareCircle</title>
<style>
  body { font-family: system-ui, "Nirmala UI", sans-serif; margin: 0; background: #f4f6fb; color: #1b2540; }
  header { background: #1f3a5f; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; }
  header small { color: #c8d4e6; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; max-width: 1100px; margin: auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  h2 { margin-top: 0; font-size: 17px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; gap: 10px; }
  .badge { padding: 3px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .taken { background: #d9f5e1; color: #146c2e; }
  .pending { background: #eef0f6; color: #556; }
  .reminded { background: #fff1cc; color: #8a5a00; }
  .alerted { background: #fddada; color: #a11; }
  #chat { height: 260px; overflow-y: auto; background: #f4f6fb; border-radius: 8px; padding: 10px; margin: 10px 0; display: flex; flex-direction: column; }
  .bubble { max-width: 80%; padding: 8px 12px; border-radius: 12px; margin: 5px 0; font-size: 14px; }
  .alexa { background: #d6e6ff; align-self: flex-start; }
  .aaji { background: #d9f5e1; align-self: flex-end; }
  button, select { padding: 8px 12px; border-radius: 8px; border: 1px solid #ccd; font-size: 14px; }
  button { background: #1f3a5f; color: #fff; border: none; cursor: pointer; }
  button.secondary { background: #e8ebf3; color: #1b2540; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  small.note { color: #667; display: block; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>CareCircle</h1>
    <small data-t="tagline"></small>
  </div>
  <select id="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
    <option value="mr">मराठी</option>
  </select>
</header>

<main>
  <section>
    <h2 data-t="dash"></h2>
    <div id="doses"></div>
    <small class="note" data-t="note1"></small>
  </section>

  <section>
    <h2 data-t="sim"></h2>
    <div class="controls">
      <select id="med"></select>
      <button onclick="startReminder()" data-t="start"></button>
      <button class="secondary" onclick="resetDemo()" data-t="reset"></button>
    </div>
    <div id="chat"></div>
    <div class="controls">
      <button class="secondary" onclick="markTaken()" data-t="yes"></button>
      <button class="secondary" onclick="listen()" data-t="speak"></button>
    </div>
    <small class="note" data-t="note2"></small>
  </section>
</main>

<script>
  const UI = {
    en: {
      tagline: "Voice medicine guardian for elders. Demo data only, not medical advice.",
      dash: "Family Dashboard",
      sim: "Aaji's Alexa+ (simulator)",
      start: "Start reminder",
      reset: "Reset demo",
      yes: "Yes, I took it",
      speak: "🎤 Speak",
      note1: "Updates every 2 seconds. An alert goes to the caregiver on Telegram if a dose is still not taken after two reminders.",
      note2: "Pick a medicine, press Start reminder, then reply by button or voice. Voice input works in Chrome.",
      taken: "Taken", pending: "Pending", reminded: "Reminded", alerted: "Caregiver alerted",
      thanks: "Thank you Aaji, I have noted it.",
      again: "Okay, I will remind you again.",
      family: "Your family has been alerted.",
      already: "That medicine is already taken.",
      press: "Press Start reminder first.",
      novoice: "Voice input is not supported in this browser. Use the button.",
      speechLang: "en-IN",
      yesRe: /\b(yes|yeah|yep|taken|took)\b/i,
    },
    hi: {
      tagline: "बुज़ुर्गों के लिए आवाज़ से चलने वाला दवा-सहायक। केवल डेमो डेटा, चिकित्सा सलाह नहीं।",
      dash: "परिवार डैशबोर्ड",
      sim: "आजी का Alexa+ (सिमुलेटर)",
      start: "रिमाइंडर शुरू करें",
      reset: "डेमो रीसेट करें",
      yes: "हाँ, मैंने ले ली",
      speak: "🎤 बोलिए",
      note1: "हर 2 सेकंड में अपडेट होता है। दो रिमाइंडर के बाद भी दवा न ली गई हो तो देखभालकर्ता को Telegram पर अलर्ट जाता है।",
      note2: "दवा चुनें, रिमाइंडर शुरू करें, फिर बटन या आवाज़ से जवाब दें। आवाज़ Chrome में चलती है।",
      taken: "ले ली", pending: "बाकी", reminded: "याद दिलाया", alerted: "परिवार को अलर्ट भेजा",
      thanks: "धन्यवाद आजी, मैंने नोट कर लिया।",
      again: "ठीक है, मैं फिर याद दिलाऊँगी।",
      family: "आपके परिवार को सूचित कर दिया गया है।",
      already: "यह दवा पहले ही ली जा चुकी है।",
      press: "पहले रिमाइंडर शुरू करें दबाइए।",
      novoice: "इस ब्राउज़र में आवाज़ इनपुट उपलब्ध नहीं है। बटन का उपयोग करें।",
      speechLang: "hi-IN",
      yesRe: /(हाँ|हां|हा|ले ली|ले लिया|haan|\bhan\b|yes)/i,
    },
    mr: {
      tagline: "वृद्धांसाठी आवाजावर चालणारा औषध-सहाय्यक. फक्त डेमो डेटा, वैद्यकीय सल्ला नाही.",
      dash: "कुटुंब डॅशबोर्ड",
      sim: "आजींचे Alexa+ (सिम्युलेटर)",
      start: "आठवण सुरू करा",
      reset: "डेमो रीसेट करा",
      yes: "हो, मी घेतले",
      speak: "🎤 बोला",
      note1: "दर 2 सेकंदांनी अपडेट होते. दोन आठवणींनंतरही औषध घेतले नसेल तर काळजीवाहकाला Telegram वर अलर्ट जातो.",
      note2: "औषध निवडा, आठवण सुरू करा, मग बटणाने किंवा आवाजाने उत्तर द्या. आवाज Chrome मध्ये चालतो.",
      taken: "घेतले", pending: "बाकी", reminded: "आठवण दिली", alerted: "कुटुंबाला अलर्ट पाठवला",
      thanks: "धन्यवाद आजी, मी नोंद केली आहे.",
      again: "ठीक आहे, मी पुन्हा आठवण करून देईन.",
      family: "तुमच्या कुटुंबाला कळवण्यात आले आहे.",
      already: "हे औषध आधीच घेतले आहे.",
      press: "आधी आठवण सुरू करा दाबा.",
      novoice: "या ब्राउझरमध्ये आवाज इनपुट उपलब्ध नाही. बटण वापरा.",
      speechLang: "mr-IN",
      yesRe: /(हो|होय|घेतली|घेतले|घेतलं|\bho\b|yes)/i,
    },
  };

  let lang = "en";
  let state = { schedule: [], reminders: {} };
  let currentId = null;
  let shown = {};
  const chat = document.getElementById("chat");
  const medSelect = document.getElementById("med");
  const langSelect = document.getElementById("lang");

  function t(key) { return UI[lang][key]; }

  function applyLang() {
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll("[data-t]")) {
      el.textContent = t(el.dataset.t);
    }
    buildMedSelect();
    renderDoses();
  }

  function buildMedSelect() {
    const keep = medSelect.value;
    medSelect.innerHTML = "";
    for (const dose of state.schedule) {
      const opt = document.createElement("option");
      opt.value = dose.id;
      opt.textContent = dose.names[lang] + " (" + dose.time + ")";
      medSelect.appendChild(opt);
    }
    if (keep) medSelect.value = keep;
  }

  function addBubble(text, who) {
    const div = document.createElement("div");
    div.className = "bubble " + who;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    const want = t("speechLang");
    const base = want.split("-")[0];
    const voices = speechSynthesis.getVoices();
    let v = voices.find((x) => x.lang === want) || voices.find((x) => x.lang.startsWith(base));
    if (!v && lang === "mr") v = voices.find((x) => x.lang.startsWith("hi"));
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = want; }
    speechSynthesis.speak(u);
  }

  function statusOf(dose) {
    if (dose.taken) return [t("taken"), "taken"];
    const r = state.reminders[dose.id];
    if (r && r.status === "alerted") return [t("alerted"), "alerted"];
    if (r && (r.status === "reminded_1" || r.status === "reminded_2")) return [t("reminded"), "reminded"];
    return [t("pending"), "pending"];
  }

  function renderDoses() {
    const box = document.getElementById("doses");
    box.innerHTML = "";
    for (const dose of state.schedule) {
      const [label, cls] = statusOf(dose);
      const row = document.createElement("div");
      row.className = "row";
      const left = document.createElement("span");
      left.textContent = dose.time + "  " + dose.names[lang];
      const badge = document.createElement("span");
      badge.className = "badge " + cls;
      badge.textContent = label;
      row.append(left, badge);
      box.appendChild(row);
    }
  }

  function showNewLines() {
    if (!currentId) return;
    const r = state.reminders[currentId];
    if (!r) return;
    const events = r.events || [];
    for (let i = shown[currentId] || 0; i < events.length; i++) {
      const e = events[i];
      if (e.type === "alerted") {
        addBubble(t("family"), "alexa");
      } else {
        addBubble(e.text, "alexa");
        speak(e.text);
      }
    }
    shown[currentId] = events.length;
  }

  async function refresh() {
    try {
      const res = await fetch("/api/state");
      state = await res.json();
      if (medSelect.options.length !== state.schedule.length) buildMedSelect();
      renderDoses();
      showNewLines();
    } catch (e) {
      console.log("Server not reachable", e);
    }
  }

  async function startReminder() {
    const id = medSelect.value;
    const res = await fetch("/api/remind/" + id + "?lang=" + lang, { method: "POST" });
    const data = await res.json();
    if (!data.ok) {
      if (data.message === "already taken") addBubble(t("already"), "alexa");
      return;
    }
    currentId = id;
    shown[id] = 0;
    refresh();
  }

  async function markTaken() {
    if (!currentId) {
      addBubble(t("press"), "alexa");
      return;
    }
    addBubble(t("yes"), "aaji");
    await fetch("/api/log/" + currentId, { method: "POST" });
    addBubble(t("thanks"), "alexa");
    speak(t("thanks"));
    refresh();
  }

  function isYes(said) {
    if (/(नहीं|नही|नाही|\bno\b|\bnot\b)/i.test(said)) return false;
    return UI[lang].yesRe.test(said);
  }

  function listen() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      addBubble(t("novoice"), "alexa");
      return;
    }
    const rec = new SR();
    rec.lang = t("speechLang");
    rec.onresult = (e) => {
      const said = e.results[0][0].transcript;
      addBubble(said, "aaji");
      if (isYes(said)) {
        markTaken();
      } else {
        addBubble(t("again"), "alexa");
      }
    };
    rec.start();
  }

  async function resetDemo() {
    await fetch("/api/reset", { method: "POST" });
    chat.innerHTML = "";
    currentId = null;
    shown = {};
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    refresh();
  }

  langSelect.onchange = () => {
    lang = langSelect.value;
    chat.innerHTML = "";
    currentId = null;
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    applyLang();
  };

  applyLang();
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
